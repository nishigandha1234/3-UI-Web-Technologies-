<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #cb8b8b;
        }
        div{
            position: absolute;
            background: rgb(188, 184, 184);
            z-index: 99;

        }
        img{
            z-index:100;
        }
        .vapour1{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            animation-name: vapour1;
            animation-duration: 4s;
            animation-iteration-count: infinite;
        }
        @keyframes vapour1 {
            to{
                transform: translate(-130px, -400px) scale(1.5);
                opacity: 0;
            }  
        }
        .vapour2{
            width: 50px;
            height: 50px;
            border-radius: 50%;
            animation-name: vapour2;
            animation-duration: 5s;
            animation-iteration-count: infinite;
            animation-delay: 0.3s;
        }
        @keyframes vapour2 {
            to{
                transform: translate(130px, -400px) scale(1.5);
                opacity: 0;
            }  

        }

        .vapour3{
            width: 20px;
            height: 20px;
            border-radius: 50%;
            animation-name: vapour3;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            animation-delay: 0.6s;
        }
        @keyframes vapour3 {
            to{
                transform: translate(-60px, -400px) scale(2);
                opacity: 0;
            }  
        }

        .vapour4{
            width: 60px;
            height: 60px;
            border-radius: 50%;
            animation-name: vapour4;
            animation-duration: 5s;
            animation-iteration-count: infinite;
            animation-delay: 1.2s;
        }
        @keyframes vapour4 {
            to{
                transform: translate(-100px, -500px) scale(1.5);
                opacity: 0;
            }  
        }

        .vapour5{
            width: 50px;
            height: 50px;
            border-radius: 50%;
            animation-name: vapour5;
            animation-duration: 4s;
            animation-iteration-count: infinite;
            animation-delay: 1.7s;
        }
        @keyframes vapour5 {
            to{
                transform: translate(60px, -400px) scale(2.5);
                opacity: 0;
            }  
        }
    


    </style>
</head>
<body>
    <img src="./Assets/20210514-01-removebg-preview.png" alt="">
    <div class="vapour1"></div>
    <div class="vapour2"></div>
    <div class="vapour3"></div>
    <div class="vapour4"></div>
    <div class="vapour5"></div>

    
</body>
</html>
