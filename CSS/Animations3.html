<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
         *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #cb8b8b;
        }
        div{
            display: flex;
            justify-content: center;
            align-items: center;
            animation-name: loader;
            animation-duration: 7s;
            border-radius: 20px;
            animation-iteration-count: infinite;
        }
        .box1{
            width: 60vh;
            height: 60vh;
            /* border: 1px solid; */
            background: rgb(230, 224, 227);
        }
        .box2{
            width: 50vh;
            height: 50vh;
            background: rgb(3, 3, 3);
        }
        .box3{
            width: 40vh;
            height: 40vh;
            background: rgb(240, 234, 237);
        }
        .box4{
            width: 30vh;
            height: 30vh;
            background: rgb(17, 16, 17);
        }
        .box5{
            width: 20vh;
            height: 20vh;
            background: rgb(238, 232, 235);
        }
        .box6{
            width: 10vh;
            height: 10vh;
            background: rgb(11, 6, 8);
        }
        @keyframes loader{
            to{
                transform: rotate(360deg);
            }
        }

    </style>
</head>
<body>
    <div class="box1">
        <div class="box2">
            <div class="box3">
                <div class="box4">
                    <div class="box5">
                        <div class="box6"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    
</body>
</html>
