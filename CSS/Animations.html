<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            display: flex;
            justify-content: end;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        div{
            width: 100px;
            height: 100px;
            border: 5px solid black;
            border: 10px blue;
            border-radius: 50%;
            animation-name: loader;
            animation-duration: 1s;

        }
        @keyframes loader{
            to{
                transform: rotate(360deg );
            }
        }
    </style>
</head>
<body>
    <div>

    </div>
    
</body>
</html>
