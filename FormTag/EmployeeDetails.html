<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Details</title>
    <link rel="stylesheet" href="employee.css">
</head>
<body>
    <div class = "container">
        <h1>EMPLOYEE INFORMATION FORM</h1>

        <div class="section-title">Personal Information</div>

            <div class="row">
                <div class="group">
                    <label>Full Name : </label>
                        <input type="text">
                </div>
            </div>

            <div class="row">
                <div class="group">
                    <label>Address : </label>
                    <input type="text">
                </div>
                
                <div class="group">
                    <label>Email : </label>
                    <input type="email">
                </div>
            </div>

            <div class="row">
                <div class="group">
                    <label>Phone Number : </label>
                    <input type="text">
                </div>
            </div>

            <div class="section-title">Employee Details</div>

                <div class="row">
                    <div class="group">
                        <label>Title : </label>
                            <input type="text">
                    </div>
                    
                    <div class="group">
                        <label>Department : </label>
                            <input type="text">
                    </div>
                </div>

                <div class="row">
                    <div class="group">
                        <label>Date Of Hire : </label>
                            <input type="date">
                    </div>
                </div>
                
                <div class="row">
                    <div class="group">
                        <label>Employee Status : </label>
                            <div class="checkbox-row">
                            <label><input type="checkbox"> Full Time</label>
                            <label><input type="checkbox"> Part Time</label>
                            <label><input type="checkbox"> Contractor</label>
                            <label><input type="checkbox"> Intern</label>
                </div>
                    </div>
                </div>

                <div class="section-title">Education</div>

                <div class="row">
                    <div class="group">
                        <label>Highest Level of Eduaction Completed :</label>
                        <input type="text">
                    </div>
                </div>
            
                <div class="row">
                    <div class="group">
                        <label>Name of Institution : </label>
                            <input type="text">
                    </div>
                    
                    <div class="group">
                        <label>Degree Earned : </label>
                            <input type="text">
                    </div>
                </div>

                <div class="row">
                    <div class="group">
                        <label>Major/Field of Study :</label>
                        <input type="text">
                    </div>

                    <div class="group">
                        <label>Graduation Date :</label>
                        <input type="date">
                    </div>
                </div>
            
                <div class="section-title">Professional Experience</div>

<label>Certificates:</label>
<input type="text">

<br><br>

<label>Previous Work Experience:</label>
<textarea></textarea>


<div class="section-title">Emergency Contact</div>

<div class="row">
    <div class="group">
        <label>Full Name:</label>
        <input type="text">
    </div>
</div>

<div class="row">
    <div class="group">
        <label>Phone:</label>
        <input type="text">
    </div>

    <div class="group">
        <label>Cell Number:</label>
        <input type="text">
    </div>
</div>

<div class="row">
    <div class="group">
        <label>Relationship:</label>
        <input type="text">
    </div>
</div>

<div class="signature">

<div class="sign-box">
<div class="line"></div>
Employee Signature
</div>

<div class="sign-box">
<div class="line"></div>
Date
</div>

</div>

</div>
</body>
</html>
